name: Work_Disk Web Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Firebase web configuration
        shell: bash
        env:
          RAW_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          value="$(printf '%s' "$RAW_FIREBASE_API_KEY" | tr -d '\r\n')"
          value="${value#\"}"
          value="${value%\"}"
          value="${value#\'}"
          value="${value%\'}"
          printf 'Firebase API key length: %s\n' "${#value}"
          printf '%s' "$value" | sha256sum | cut -d' ' -f1
          expected='da4926c58c63b74a2c0ec66f41e1e365ce9370c217824af13712904af5f8ad75'
          actual="$(printf '%s' "$value" | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo 'Firebase API key secret does not match the current Firebase Web App key.'
            echo 'Update VITE_FIREBASE_API_KEY in GitHub Actions secrets using the current Firebase Web App config.'
            exit 1
          fi
          echo 'Firebase API key matches the current Firebase Web App config.'
      - name: Validate Work_Disk API URL
        shell: bash
        env:
          WORK_DISK_API_URL: ${{ secrets.VITE_WORK_DISK_API_URL }}
        run: |
          set -euo pipefail
          expected='https://work-disk-account-api.onrender.com'
          value="$(printf '%s' "${WORK_DISK_API_URL:-}" | tr -d '\r\n')"
          value="${value%/}"
          if [ "$value" != "$expected" ]; then
            echo "VITE_WORK_DISK_API_URL must be exactly: $expected"
            echo 'Refusing to deploy a build with an incorrect or placeholder API hostname.'
            exit 1
          fi
          echo 'Work_Disk API URL matches the production Account API hostname.'
      - name: Build Work_Disk web
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WORK_DISK_API_URL: ${{ secrets.VITE_WORK_DISK_API_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
