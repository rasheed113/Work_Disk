name: Work_Disk Web

on:
  pull_request:
    paths:
      - 'work_disk_web/**'
      - '.github/workflows/work-disk-web.yml'
  push:
    branches: [main]
    paths:
      - 'work_disk_web/**'
      - '.github/workflows/work-disk-web.yml'

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work_disk_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work_disk_web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
