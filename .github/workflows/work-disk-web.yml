name: Work_Disk Web

on:
  pull_request:
    paths:
      - 'work_disk_web/**'
      - '.github/workflows/work-disk-web.yml'
  push:
    branches: [main]
    paths:
      - 'work_disk_web/**'
      - '.github/workflows/work-disk-web.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work_disk_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work_disk_web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: work_disk_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work_disk_web/package.json
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work_disk_web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
